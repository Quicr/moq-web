server {
    listen 443 ssl http2;
    server_name snk-dev-1-m01x.org;

    ssl_certificate     /etc/letsencrypt/live/snk-dev-1-m01x.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snk-dev-1-m01x.org/privkey.pem;

    # SPA static files (built Vite output)
    root /opt/moq-chat/dist;
    index index.html;

    # Token service API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
