name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libs (draft-16)
        run: pnpm run build
        env:
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Build all demo apps
        run: |
          mkdir -p dist-combined/apps
          cp apps/index.html dist-combined/apps/ 2>/dev/null || true
          for app in apps/*/; do
            if [ -f "$app/package.json" ]; then
              appname=$(basename "$app")
              (cd "$app" && pnpm vite build --base /${{ github.event.repository.name }}/apps/$appname/)
              if [ -d "$app/dist" ]; then
                cp -r "$app/dist" "dist-combined/apps/$appname"
              fi
            fi
          done

      - name: Landing page — use chat-call as root when present
        run: |
          if [ -d dist-combined/apps/chat-call ]; then
            cp -r dist-combined/apps/chat-call/. dist-combined/
          elif [ -d dist-combined/apps/auth-demo ]; then
            cp -r dist-combined/apps/auth-demo/. dist-combined/
          fi

      - name: Rebuild workspace libs (draft-18)
        run: |
          pnpm run clean
          pnpm run build:draft-18
        env:
          BASE_URL: /${{ github.event.repository.name }}/18/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-combined

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
