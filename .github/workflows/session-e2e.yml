name: e2e (live relay)

on:
  schedule:
    # Daily at 02:00 UTC. Non-blocking — this suite hits a live relay
    # and can flake for reasons unrelated to any PR. Use workflow_dispatch
    # to trigger it on demand.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      relay_url:
        description: 'Relay URL for every cell (empty: each cell uses its own relay)'
        required: false
        default: ''

jobs:
  session-e2e:
    name: session-e2e (${{ matrix.relay }}, ${{ matrix.draft }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cells marked experimental report but do not fail the run
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { relay: openmoq, draft: draft-22, relay_url: 'https://moqx-main.ci.openmoq.org:4433/moq-relay' }
          - { relay: openmoq, draft: draft-18, relay_url: 'https://moqx-main.ci.openmoq.org:4433/moq-relay' }
          - { relay: openmoq, draft: draft-16, relay_url: 'https://moqx-main.ci.openmoq.org:4433/moq-relay' }
          - { relay: cloudflare, draft: draft-22, relay_url: 'https://moq-ng.cloudflare.mediaoverquic.com' }
          - { relay: meta, draft: draft-22, relay_url: 'https://fb.mvfst.net:9448/moq-relay' }
          # Draft-23: as of 2026-11-10 neither relay offers moqt-23 in
          # WT-Available-Protocols (they select moqt-22), so these fail at
          # the WebTransport handshake until the relays add it.
          - { relay: cloudflare, draft: draft-23, relay_url: 'https://moq-ng.cloudflare.mediaoverquic.com', experimental: true }
          - { relay: meta, draft: draft-23, relay_url: 'https://fb.mvfst.net:9448/moq-relay', experimental: true }
    env:
      MOQT_VERSION: ${{ matrix.draft }}
      # The relays accept unauthenticated setup today; the secret is
      # optional and only forwarded when configured.
      MOQ_AUTH_TOKEN: ${{ secrets.MOQ_AUTH_TOKEN }}
      # A dispatch input overrides every cell; cron uses each cell's relay.
      RELAY_URL: ${{ inputs.relay_url || matrix.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (${{ matrix.draft }})
        run: pnpm run build:${{ matrix.draft }}

      - name: Install Playwright Chromium
        run: pnpm --filter @moq-web/session-e2e exec playwright install --with-deps chromium

      - name: Run session-e2e
        run: RUN_E2E=1 pnpm --filter @moq-web/session-e2e test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-e2e-screenshots-${{ matrix.relay }}-${{ matrix.draft }}
          path: packages/session-e2e/tests/__screenshots__
          retention-days: 7
          if-no-files-found: ignore

  media-e2e:
    name: media-e2e (${{ matrix.draft }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        draft: [draft-22, draft-18]
    env:
      MOQT_VERSION: ${{ matrix.draft }}
      MOQ_AUTH_TOKEN: ${{ secrets.MOQ_AUTH_TOKEN }}
      RELAY_URL: ${{ inputs.relay_url || 'https://moqx-main.ci.openmoq.org:4433/moq-relay' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (${{ matrix.draft }})
        run: pnpm run build:${{ matrix.draft }}

      - name: Install Playwright Chromium
        run: pnpm --filter @moq-web/media-e2e exec playwright install --with-deps chromium

      - name: Run media-e2e
        run: RUN_E2E=1 pnpm --filter @moq-web/media-e2e test

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: media-e2e-screenshots-${{ matrix.draft }}
          path: packages/media-e2e/tests/__screenshots__
          retention-days: 7
          if-no-files-found: ignore
